[manifest]
version = "1.0.0"
dump_lua = true
priority = -1

# Rush Hour - remove tags
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "if type == 'Small' then"
position = "at"
payload = "if type == 'Small' and not G.GAME.modifiers.cry_no_tags then"
match_indent = true

# Rush Hour - remove tags
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "elseif type == 'Big' then"
position = "at"
payload = "elseif type == 'Big' and not G.GAME.modifiers.cry_no_tags then"
match_indent = true

# Rush Hour - remove tags
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "elseif not run_info then"
position = "at"
payload = "elseif type == 'Boss' and not run_info then"
match_indent = true

# Disabled challenges in the challenge list: treat them as locked, so the button is greyed out
# and can't be clicked. The wildcard matches both vanilla's line and SMODS's rewrite of it.
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "local challenge_unlocked = *"
position = "after"
payload = '''
local challenge_disabled = Cryptid and Cryptid.get_center and Cryptid.get_center(v.key or v.id) and (Cryptid.enabled(v.key or v.id) ~= true)
if challenge_disabled then challenge_unlocked = false end
'''
match_indent = true

# ...and label them "<name> (Disabled)" instead of "Locked". If this stops matching, they still
# can't be started; only the label falls back to "Locked".
[[patches]]
[patches.regex]
target = "functions/UI_definitions.lua"
pattern = '''(?<pre>label = \{challenge_unlocked and localize\(v\.id, 'challenge_names'\) or )localize\('k_locked'\)'''
position = "at"
payload = '''$pre(challenge_disabled and (localize(v.id, 'challenge_names') .. ' (' .. localize('cry_gameset_disabled') .. ')') or localize('k_locked'))'''

# cry_no_boosters - disable boosters in shop
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if G.GAME.current_round.used_packs[i] ~= 'USED' then"
position = "at"
payload = "if G.GAME.current_round.used_packs[i] ~= 'USED' and not G.GAME.modifiers.cry_no_boosters then"
match_indent = true